<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141927">
  <meta name="description" content="つみべん — ページが見つかりません。">
  <title>ページが見つかりません — つみべん</title>
  <link rel="icon" href="/public/app-icon-focus-v4.png">
  <link rel="apple-touch-icon" href="/public/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css?v=5">
  <style>
    .not-found{min-height:100svh;display:grid;place-items:center;padding:96px 24px;text-align:center}.not-found-inner{max-width:620px}.not-found img{width:82px;height:82px;border-radius:22px;box-shadow:0 18px 55px rgba(0,0,0,.35)}.not-found h1{font-size:clamp(38px,9vw,72px);margin:26px 0 12px}.not-found p{color:var(--mute);margin:0 auto 28px}.not-found a{display:inline-flex;min-height:48px;align-items:center;padding:10px 20px;border-radius:14px;background:var(--coral);color:#fff;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <img src="/public/app-icon-focus-v4.png" alt="">
      <p class="section-label">404 / NOT FOUND</p>
      <h1>この粒は、<br>見つかりません。</h1>
      <p>URLが変わったか、ページがまだ積まれていないようです。</p>
      <a href="/">つみべんのホームへ</a>
    </div>
  </main>
</body>
</html>
