name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - Scripts/validate-site.py
      - http_dists/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate static site
        run: |
          python3 Scripts/validate-site.py
          node --check http_dists/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: http_dists

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Smoke test published site
        env:
          SITE_URL: https://tumiben.hinoshiba.com/
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local url="$1"
            local status
            for attempt in {1..12}; do
              status=$(curl --silent --show-error --max-time 20 \
                --output /dev/null --write-out '%{http_code}' "$url" || true)
              if [[ "$status" == 200 ]]; then
                echo "OK: $url"
                return 0
              fi
              if [[ "$attempt" -lt 12 ]]; then
                sleep 10
              fi
            done
            echo "::error::Expected direct HTTP 200 from $url; got $status"
            return 1
          }

          base_url="${SITE_URL%/}/"
          check_url "$base_url"
          check_url "${base_url}privacy/"
          check_url "${base_url}support/"
          check_url "${base_url}og-focus-v5.png"
          check_url "${base_url}public/app-icon-focus-v4.png"
          check_url "${base_url}public/app-home-current.webp"
          check_url "${base_url}font-license.txt"
