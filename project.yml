name: PomoGem
options:
  bundleIdPrefix: com.hinoshiba
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "10"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: true
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # String Catalogs (Docs/Localization.md). The compiler records every
    # String(localized:table:) and Text(_:tableName:) key in .stringsdata, which
    # Scripts/l10n/l10n.py syncs into the per-feature catalogs and checks in CI.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  PomoGem:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
    info:
      path: PomoGem/Info.plist
      properties:
        CFBundleDisplayName: ポモジェム
        CFBundleURLTypes:
          - CFBundleURLName: com.hinoshiba.pomogem
            CFBundleURLSchemes:
              - pomogem
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 hinoshiba
        NSSupportsLiveActivities: true
        LSApplicationCategoryType: public.app-category.education
        UIApplicationSupportsIndirectInputEvents: true
        # launch-03: the first frame of every launch matches NightBackground
        # instead of flashing black before the storage choice or the jar.
        UILaunchScreen:
          UIColorName: ink.night
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationPortraitUpsideDown
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryAddUsageDescription: シェアカードを写真に保存します。
        NSMotionUsageDescription: 端末の傾きや振る操作に合わせて瓶の粒を動かすために使います。値は保存・送信しません。
        ITSAppUsesNonExemptEncryption: false
        # The CloudKit container environment, expanded from the SAME build
        # setting that fills the icloud-container-environment entitlement, so
        # the runtime can scope device-side transfer state by the database it
        # actually talks to. SecTask* is not public on iOS, so the signed
        # entitlement itself cannot be read back at runtime.
        POMOGEM_ICLOUD_CONTAINER_ENVIRONMENT: $(ICLOUD_CONTAINER_ENVIRONMENT)
        POMOGEM_PRIVACY_POLICY_URL: "https://pomogem.hinoshiba.com/#privacy"
        UIAppFonts:
          - ZenMaruGothic-Black.ttf
        UIBackgroundModes:
          - remote-notification
    sources:
      - path: PomoGem
        excludes:
          - Resources/Products.storekit
          - Resources/GENERATED-ASSETS.md
      - path: Shared
    entitlements:
      path: PomoGem/PomoGem.entitlements
      properties:
        com.apple.developer.family-controls: true
        # Only the focus/break end alerts use .timeSensitive (NotificationManager).
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.com.hinoshiba.pomogem
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.hinoshiba.pomogem
        com.apple.developer.icloud-container-environment: $(ICLOUD_CONTAINER_ENVIRONMENT)
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.pomogem
        PRODUCT_NAME: PomoGem
      configs:
        Debug:
          APS_ENVIRONMENT: development
          ICLOUD_CONTAINER_ENVIRONMENT: Development
        Release:
          APS_ENVIRONMENT: production
          ICLOUD_CONTAINER_ENVIRONMENT: Production
    dependencies:
      - target: PomoGemScreenTimeMonitor
        embed: true
        destinationFilters:
          - iOS
      - target: PomoGemWidgets
        embed: true
        destinationFilters:
          - iOS
  PomoGemWidgets:
    type: app-extension
    platform: iOS
    info:
      path: PomoGemWidgets/Info.plist
      properties:
        CFBundleDisplayName: ポモジェム
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 hinoshiba
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: PomoGemWidgets
        excludes:
          - PrivacyInfo.xcprivacy
          - PomoGemWidgets.entitlements
      - path: Shared/FocusActivityAttributes.swift
      # PomoGemLocale and DurationText, so the Live Activity and widgets format
      # durations like the app (Docs/Localization.md).
      - path: Shared/LocalizedDuration.swift
      - path: PomoGemWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.pomogem.widgets
        PRODUCT_NAME: PomoGemWidgets
        SKIP_INSTALL: true
  PomoGemScreenTimeMonitor:
    type: app-extension
    platform: iOS
    info:
      path: PomoGemScreenTimeMonitor/Info.plist
      properties:
        CFBundleDisplayName: ポモジェム スクリーンタイム
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ScreenTimeMonitorExtension
    sources:
      - path: PomoGemScreenTimeMonitor
        excludes:
          - PomoGemScreenTimeMonitor.entitlements
      - path: Shared/ScreenTimePolicy.swift
      - path: Shared/ScreenTimeCallbackDiagnostics.swift
      - path: Shared/ScreenTimeStore.swift
      - path: Shared/ScreenTimeMonitoring.swift
    entitlements:
      path: PomoGemScreenTimeMonitor/PomoGemScreenTimeMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.hinoshiba.pomogem
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.pomogem.screentimemonitor
        PRODUCT_NAME: PomoGemScreenTimeMonitor
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
  PomoGemTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PomoGemTests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.pomogem.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PomoGem.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PomoGem"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: PomoGem
  PomoGemUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PomoGemUITests
      - path: PomoGem/Resources/Products.storekit
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.pomogem.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: PomoGem
schemes:
  PomoGem:
    build:
      targets:
        PomoGem: all
        PomoGemTests: [test]
        PomoGemUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: PomoGem/Resources/Products.storekit
    test:
      config: Debug
      # Unit and UI tests assert Japanese copy. Pin the host language so a
      # Simulator in another language (CI runs en-US) cannot switch them once
      # the app ships a second localization.
      language: ja
      region: JP
      targets:
        - PomoGemTests
        - PomoGemUITests
    archive:
      config: Release
