name: PomoGem
options:
  bundleIdPrefix: com.hinoshiba
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "7"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: true
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  PomoGem:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
    info:
      path: PomoGem/Info.plist
      properties:
        CFBundleDisplayName: ポモジェム
        CFBundleURLTypes:
          - CFBundleURLName: com.hinoshiba.pomogem
            CFBundleURLSchemes:
              - pomogem
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 hinoshiba
        NSSupportsLiveActivities: true
        LSApplicationCategoryType: public.app-category.education
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryAddUsageDescription: シェアカードを写真に保存します。
        NSMotionUsageDescription: 端末の傾きや振る操作に合わせて瓶の粒を動かすために使います。値は保存・送信しません。
        ITSAppUsesNonExemptEncryption: false
        POMOGEM_PRIVACY_POLICY_URL: "https://pomogem.hinoshiba.com/#privacy"
        UIAppFonts:
          - ZenMaruGothic-Black.ttf
        UIBackgroundModes:
          - remote-notification
    sources:
      - path: PomoGem
        excludes:
          - Resources/Products.storekit
          - Resources/GENERATED-ASSETS.md
      - path: Shared
    entitlements:
      path: PomoGem/PomoGem.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.hinoshiba.pomogem
        com.apple.developer.icloud-container-environment: $(ICLOUD_CONTAINER_ENVIRONMENT)
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.pomogem
        PRODUCT_NAME: PomoGem
      configs:
        Debug:
          APS_ENVIRONMENT: development
          ICLOUD_CONTAINER_ENVIRONMENT: Development
        Release:
          APS_ENVIRONMENT: production
          ICLOUD_CONTAINER_ENVIRONMENT: Production
    dependencies:
      - target: PomoGemWidgets
        embed: true
        destinationFilters:
          - iOS
  PomoGemWidgets:
    type: app-extension
    platform: iOS
    info:
      path: PomoGemWidgets/Info.plist
      properties:
        CFBundleDisplayName: ポモジェム
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 hinoshiba
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: PomoGemWidgets
        excludes:
          - PrivacyInfo.xcprivacy
          - PomoGemWidgets.entitlements
      - path: Shared/FocusActivityAttributes.swift
      - path: PomoGemWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.pomogem.widgets
        PRODUCT_NAME: PomoGemWidgets
        SKIP_INSTALL: true
  PomoGemTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PomoGemTests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.pomogem.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PomoGem.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PomoGem"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: PomoGem
  PomoGemUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PomoGemUITests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.pomogem.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: PomoGem
schemes:
  PomoGem:
    build:
      targets:
        PomoGem: all
        PomoGemTests: [test]
        PomoGemUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: PomoGem/Resources/Products.storekit
    test:
      config: Debug
      targets:
        - PomoGemTests
        - PomoGemUITests
    archive:
      config: Release
