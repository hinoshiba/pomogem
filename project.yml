name: Tsumiben
options:
  bundleIdPrefix: com.hinoshiba
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: true
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Tsumiben:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
    info:
      path: Tsumiben/Info.plist
      properties:
        CFBundleDisplayName: つみべん
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 hinoshiba
        NSSupportsLiveActivities: true
        LSApplicationCategoryType: public.app-category.education
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryAddUsageDescription: シェアカードを写真に保存します。
        NSMotionUsageDescription: 端末の傾きや振る操作に合わせて瓶の粒を動かすために使います。値は保存・送信しません。
        ITSAppUsesNonExemptEncryption: false
        TSUMIBEN_PRIVACY_POLICY_URL: "https://tumiben.hinoshiba.com/privacy/"
        UIAppFonts:
          - ZenMaruGothic-Black.ttf
        UIBackgroundModes:
          - remote-notification
    sources:
      - path: Tsumiben
        excludes:
          - Resources/Products.storekit
          - Resources/GENERATED-ASSETS.md
      - path: Shared
    entitlements:
      path: Tsumiben/Tsumiben.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.hinoshiba.tumiben
        com.apple.developer.icloud-container-environment: $(ICLOUD_CONTAINER_ENVIRONMENT)
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.tumiben
        PRODUCT_NAME: Tsumiben
      configs:
        Debug:
          APS_ENVIRONMENT: development
          ICLOUD_CONTAINER_ENVIRONMENT: Development
        Release:
          APS_ENVIRONMENT: production
          ICLOUD_CONTAINER_ENVIRONMENT: Production
    dependencies:
      - target: TsumibenWidgets
        embed: true
        destinationFilters:
          - iOS
  TsumibenWidgets:
    type: app-extension
    platform: iOS
    info:
      path: TsumibenWidgets/Info.plist
      properties:
        CFBundleDisplayName: つみべん
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 hinoshiba
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: TsumibenWidgets
        excludes:
          - PrivacyInfo.xcprivacy
          - TsumibenWidgets.entitlements
      - path: Shared/FocusActivityAttributes.swift
      - path: TsumibenWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.tumiben.widgets
        PRODUCT_NAME: TsumibenWidgets
        SKIP_INSTALL: true
  TsumibenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TsumibenTests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.tumiben.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tsumiben.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tsumiben"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Tsumiben
  TsumibenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TsumibenUITests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.tumiben.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Tsumiben
schemes:
  Tsumiben:
    build:
      targets:
        Tsumiben: all
        TsumibenTests: [test]
        TsumibenUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Tsumiben/Resources/Products.storekit
    test:
      config: Debug
      targets:
        - TsumibenTests
        - TsumibenUITests
    archive:
      config: Release
