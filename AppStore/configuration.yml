i_cloud_sync:
  database_scope: private
  first_launch_choices:
    presentation: equal_neither_recommended
    options:
      - icloud_sync_after_confirmation
      - this_iphone_only
    immutable_in_version_1: true
  access_without_icloud: all_basic_features_via_explicit_this_iphone_only_choice
  local_only:
    requires_apple_account: false
    requires_network: false
    storage: random_namespaced_device_only_store
    automatic_cloud_switch_or_upload: false
    app_deletion_erases_data: true
    json_export_can_be_reimported: false
    json_export_is_migration: false
  cloud_confirmation_disclosure:
    - theme_names
    - achievement_memos
    - records
    - settings
    - active_timer
  account_verification: account_status_pre_and_post_probe_user_record_id_match_and_read_only_private_zone_fetch_at_selection_and_each_launch_or_resume
  developer_access_assumption: no_access_or_retention_by_developer
  source_models:
    - Subject
    - StudySession
    - AchievementStone
    - Prefs
    - ActivityResetMarker
    - SyncedFocusTimer
    - FocusTimerDeviceClaim
  source_replica_policy:
    current_or_awaiting_epoch_physical_rows: retained
    background_maintenance: read_only_logical_resolution
    duplicate_physical_compaction: disabled
    fan_out_writes_across_observed_copies: disabled
    allowed_source_deletions:
      - rows_in_an_explicitly_proven_stale_epoch
      - closed_focus_active_tail_after_a_materialized_study_session
  final_source_schema_gate:
    first_public_release: true
    development_environment: initialize_new_container_from_final_release_candidate
    physical_identity_fields:
      Subject: syncRecordID
      StudySession: syncRecordID
      AchievementStone: syncRecordID
      Prefs: syncRecordID
      FocusTimerDeviceClaim: syncRecordID
    subject_revision_fields:
      - contentRevision
      - contentMutationID
      - deletedAt
    achievement_revision_fields:
      - revision
      - deletedAt
      - deletionRevision
      - deletionMutationID
      - restoredDeletionMutationID
      - updatedAt
    prefs_writer_field: settingsWriterID
    prefs_revision_mutation_group_count: 13
    prefs_stamp_field_count: 26
    prefs_timer_completion_fields:
      - timerCompletionSoundRawValue
      - timerCompletionSoundRevision
      - timerCompletionSoundMutationID
      - timerCompletionHapticRawValue
      - timerCompletionHapticRevision
      - timerCompletionHapticMutationID
    prefs_timer_display_fields:
      - timerDisplayModeRawValue
      - timerDisplayModeRevision
      - timerDisplayModeMutationID
    prefs_timer_display_default: ringAndTime
    prefs_timer_display_allowed_raw_values:
      - ringAndTime
      - filledDial
      - timeOnly
      - ringOnly
    prefs_revision_mutation_groups:
      - sound
      - haptics
      - timerCompletionSound
      - timerCompletionHaptic
      - rareReward
      - reminderEnabled
      - reminderTime
      - shareIncludesManual
      - externalTheme
      - keepScreenAwake
      - preferredFocusMinutes
      - timerDisplayMode
      # Historical CloudKit/export field retained for schema compatibility.
      # The shipping UI uses one study/work theme list and does not branch on this value.
      - usagePurpose
    promotion: validate_final_development_schema_then_deploy_unchanged_to_production
    production_environment_reset: prohibited
  local_projection_models:
    - AggregatePebble
    - Stratum
    - Bedrock
    - GachaState
  manual_entry_limit:
    count: 3
    day_boundary_local_hour: 4
    scope: per_device
    offline_multi_device_global_hard_cap: false
    disclosure: app_ui_and_review_notes
  account_boundary:
    identity_resolution: fail_closed_before_model_container
    local_namespace: random_bound_to_initial_verified_apple_account
    identity_evidence:
      - ckcontainer_account_status
      - ckcontainer_user_record_id
    persisted_binding: initial_sha256_fingerprint_and_random_namespace
    remount_rule: exact_fingerprint_and_namespace_match_only
    offline_reuse: disabled
    different_account_behavior: fail_closed_without_deleting_data
    missing_network_behavior: fail_closed_without_deleting_data
    inconsistent_persistence_history_behavior: recovery_gate_without_fresh_choice_or_overwrite
    committed_selection_with_zero_store_files: valid_one_time_mount_crash_boundary
    widget_surface: account_neutral_launcher_without_user_data
    widget_reads_app_group_or_icloud: false
    live_activities: account_neutral_timer_only_without_user_authored_or_account_data
    local_notification_payload: account_neutral_without_subject_name
    suspended_account_change_notification_residual: stale_generic_completion_may_arrive_once
    widget_uses_synchronized_data_container: false
  reset_ordering:
    primary: lamport_sequence
    supported_sequence_range: 0...1000000
    wall_clock_role: display_and_audit_metadata_only
  maintenance:
    projection_rebuild_beyond_home_512_row_window: true
    local_projection_compaction: allowed_rebuildable_device_only_data
    focus_terminal_compaction: disabled_source_rows_retained
    materialized_session_closed_focus_tail_cleanup: allowed
