release_blockers:
  - capture and verify the new PomoGem IAP review screenshot with the live StoreKit price for com.hinoshiba.pomogem.pro.lifetime
  - register and verify the new PomoGem IAP before submission
  - signed clean-install testing must verify the equal first-launch choices, both confirmations, immutable selection, and the complete local-only basic experience without an Apple Account or network
  - initialize the new PomoGem CloudKit development container from the final release candidate including replica identity, Subject tombstone, Achievement deletion-event and restore-ack fields, the timer-completion and timer-display raw selections, and all 26 preference stamp fields, validate it, then deploy that exact seven-model source schema to production without resetting production
  - signed two-device testing must verify source synchronization, account A-to-B blocking and return-to-A remount, bounded reconciliation, timer handoff, and fail-closed network-loss recovery
  - owner must accept the focus partition trade-off that materialized completions survive delayed cancellation
  - owner must accept the fail-closed interactive recovery ceiling when more than 256 corrupt active logical timer sessions precede a valid session, or ship a versioned reversible quarantine design
  - Japan paid-IAP operator disclosure and pre-purchase legal presentation require owner or qualified legal determination
  - owner must choose mixed-license publication or relicense and replace the excluded brand assets
  - publish and verify the Privacy, Support, and Terms pages plus the noindex seller-disclosure endpoint linked only beside the Pro offer and before the in-app purchase button over canonical HTTPS
  - complete StoreKit Sandbox, signed-device, TestFlight, App Store metadata, and distribution-signing verification
