release_blockers:
  - verify Family Controls distribution authorization and matching final profiles for both host and Screen Time monitor extension
  - verify actual signed-device 10-minute learning and black-gem delivery after the callback fix; prior failed or simulator-only checks are not a pass
  - capture and verify the new PomoGem IAP review screenshot with the live StoreKit price for com.hinoshiba.pomogem.pro.lifetime
  - compare current store screenshots with the final candidate and replace stale settings or Pro feature images
  - candidate signed-device testing must verify equal first-launch choices and both confirmations, explicit enable/disable confirmations and initially unselected deletion acknowledgment, verified destination copies and retained cloud data on disable, offline eligibility/revocation/reconnect and pending-upload disclosures, and complete local-only basic use without an Apple Account or network; record untested cases as pending
  - owner must accept the focus partition trade-off that materialized completions survive delayed cancellation
  - owner must accept the fail-closed interactive recovery ceiling when more than 256 corrupt active logical timer sessions precede a valid session, or ship a versioned reversible quarantine design
  - Japan paid-IAP operator disclosure and pre-purchase legal presentation require owner or qualified legal determination
  - complete StoreKit Sandbox, signed-device, TestFlight, App Store metadata, and distribution-signing verification

